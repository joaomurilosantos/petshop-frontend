<div class="app-container">
  <div class="card">
    <h3>Pet</h3>
    <ul class="pet-list">
      <li *ngFor="let pet of pets">
        <span class="badge">{{ pet.id }}</span>
        {{ pet.name }}
        <div class="button-group">
          <button type="button" class="update" title="Atualizar Pet" 
                  (click)="update(pet)">
            Atualizar
          </button>
          <button type="button" class="delete" title="Deletar Pet" 
                  (click)="delete(pet)">
            Deletar
          </button>
        </div>
      </li>
    </ul>
    <button class="add-button" (click)="add()">
      Adicionar Pet
    </button>
  </div>
</div>
