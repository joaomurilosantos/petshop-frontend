<h2>Pets</h2>

<div>
  <button type="button" class="add-button" (click)="add()">
    Adicionar Pet
  </button>
</div>
<ul class="heroes">
  <li *ngFor="let pet of pets" class="tutor-item">
    <span class="badge">{{ pet.id }}</span> {{ pet.name }}

    <span class="button-group">
      <button type="button" class="update" title="Atualizar Tutor"
        (click)="update(pet)">Atualizar
      </button>

      <button type="button" class="delete" title="Deletar Tutor"
        (click)="delete(pet)">Deletar
      </button>
    </span>
  </li>
</ul>
