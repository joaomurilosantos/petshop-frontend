<div *ngIf="messageService.messages.length" class="card">
  <h3>Mensagens</h3>
  <button
    type="button"
    class="clear"
    (click)="messageService.clear()"
    aria-label="Limpar mensagens"
  >
    Limpar mensagens
  </button>

  <div *ngFor="let message of messageService.messages">
    {{ message }}
  </div>
</div>
