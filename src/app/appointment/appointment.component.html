<h2>Agendamentos</h2>

<div>
  <button type="button" class="add-button" (click)="add()">
    Adicionar Agendamento
  </button>
</div>
<ul class="heroes">
  <li *ngFor="let appointment of appointments" class="tutor-item">
    <span class="badge">{{ appointment.id }}</span> {{ appointment.consulta }}

    <span class="button-group">
      <button type="button" class="update" title="Atualizar Agendamento"
        (click)="update(appointment)">Atualizar
      </button>

      <button type="button" class="delete" title="Deletar Agendamento"
        (click)="delete(appointment)">Deletar
      </button>
    </span>
  </li>
</ul>
