<h2>My Heroes</h2>

<div>
  <button type="button" class="add-button" (click)="add()">
    Adicionar Tutor
  </button>
</div>
<ul class="heroes">
  <li *ngFor="let tutor of tutors">
    
    <span class="badge">{{tutor.id}}</span> {{tutor.name}}
    
    <button type="button" class="delete" title="deletar tutor"
      (click)="delete(tutor)">x
    </button>
    <button type="button" class="delete" title="atualizar tutor"
      (click)="update(tutor)">x
    </button>
  </li>
</ul>
