<form [formGroup]="AppointmentForm" (ngSubmit)="onSave()">

  <mat-form-field>
    <mat-label>Pet</mat-label>
    <mat-select formControlName="petId">
      @for (pet of pets; track pet) {
        <mat-option [value]="pet.id">{{pet.name}}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill">
  <mat-label>Data da Consulta</mat-label>
  <input matInput [matDatepicker]="picker" formControlName="consulta">
  <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
  <mat-datepicker #picker></mat-datepicker>
  </mat-form-field>

  <div mat-dialog-actions>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit">Save</button>
  </div>
</form>
