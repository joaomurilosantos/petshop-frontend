<form [formGroup]="petForm" (ngSubmit)="onSave()">
  <mat-form-field appearance="fill">
    <mat-label>Nome</mat-label>
    <input matInput formControlName="name">
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Espécie</mat-label>
    <mat-select formControlName="speciesId">
      @for (s of species; track s) {
        <mat-option [value]="s.id">{{s.speciesName}}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Raça</mat-label>
    <mat-select formControlName="breedId">
      @for (breed of breeds; track breed) {
        <mat-option [value]="breed.id">{{breed.breedName}}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field>
    <mat-label>Tutor</mat-label>
    <mat-select formControlName="tutorId">
      @for (tutor of tutors; track tutor) {
        <mat-option [value]="tutor.id">{{tutor.name}}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <mat-form-field appearance="fill">
    <mat-label>Idade</mat-label>
    <input matInput formControlName="age">
  </mat-form-field>

  <div mat-dialog-actions>
    <button mat-button type="button" (click)="onCancel()">Cancel</button>
    <button mat-raised-button color="primary" type="submit">Save</button>
  </div>
</form>
